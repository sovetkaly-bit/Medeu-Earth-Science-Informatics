name: R40 ICESat-2 risk-coverage of the transferred abstention model
on:
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    working-directory: research/R40_KZ
jobs:
  riskcov:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Restore saved ATL08 points
        run: |
          git clone -q --depth 1 -b r40-icesat2 "https://github.com/${{ github.repository }}" /tmp/prev
          mkdir -p output_riskcov/icesat2 && cp /tmp/prev/icesat2/*.csv output_riskcov/icesat2/ && ls output_riskcov/icesat2
      - name: Run
        env:
          R40_OUT: output_riskcov
        run: python -m src.icesat2_riskcov 2>&1 | tee riskcov_console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R40-ICESat2-riskcov
          path: research/R40_KZ/output_riskcov/tables/
          retention-days: 90
      - name: Publish tables to branch r40-icesat2-riskcov
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/res && mkdir -p /tmp/res/tables && cp output_riskcov/tables/*.csv /tmp/res/tables/ 2>/dev/null || true
          cp output_riskcov/*.json output_riskcov/*.csv riskcov_console.log /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q -b r40-icesat2-riskcov
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "R40 ICESat-2 risk-coverage: run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "HEAD:refs/heads/r40-icesat2-riskcov"
