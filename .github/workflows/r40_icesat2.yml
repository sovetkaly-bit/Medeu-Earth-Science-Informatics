name: R40 ICESat-2 ATL08 extract + analysis
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: extract = read ATL08 only; analyze = reuse saved points; all = both
        options: [all, extract, analyze]
        default: all
      only:
        description: "Comma-separated study areas (empty = all): kz_all,davos_parsenn,zermatt_gornergrat,alta_snowbird,park_city"
        default: ""
permissions:
  contents: write
defaults:
  run:
    working-directory: research/R40_KZ
jobs:
  icesat2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            research/R40_KZ/requirements.txt
            research/R40_KZ/requirements-earthdata.txt
      - run: python -m pip install -r requirements.txt -r requirements-earthdata.txt
      - run: python -m unittest discover -s tests
      - name: Restore previously saved ATL08 points (kept across runs)
        continue-on-error: true
        run: |
          git clone -q --depth 1 -b r40-icesat2 "https://github.com/${{ github.repository }}" /tmp/prev
          mkdir -p output_icesat2/icesat2 && cp /tmp/prev/icesat2/*.csv output_icesat2/icesat2/ && ls output_icesat2/icesat2
      - name: Run
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          R40_OUT: output_icesat2
          MODE: ${{ inputs.mode }}
          ONLY: ${{ inputs.only }}
        run: python -m src.icesat2 --stage "$MODE" --only "$ONLY" 2>&1 | tee icesat2_console.log
      - name: Guard - token must not appear in outputs
        if: always()
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          mkdir -p output_icesat2; cp icesat2_console.log output_icesat2/ 2>/dev/null || true
          if [ -n "$EARTHDATA_TOKEN" ] && grep -rF -- "$EARTHDATA_TOKEN" output_icesat2; then echo "TOKEN LEAK"; rm -rf output_icesat2; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R40-ICESat2
          path: research/R40_KZ/output_icesat2/
          retention-days: 90
      - name: Publish to branch r40-icesat2
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/res && mkdir /tmp/res && cp -r output_icesat2/. /tmp/res/
          cd /tmp/res && git init -q -b r40-icesat2
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "R40 ICESat-2: run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" r40-icesat2
