name: R40 Sentinel-1 via HyP3 (plan / submit within budget / collect)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, submit, collect]
        default: plan
      years:
        description: "Years, comma-separated"
        default: "2025"
      tracks:
        description: "Relative orbits, comma-separated (empty = all)"
        default: ""
      max_per_track:
        default: "12"
      max_jobs:
        default: "12"
      budget:
        description: "Max HyP3 credits this run may spend (INSAR_GAMMA 20x4 = 10 credits)"
        default: "150"
permissions:
  contents: write
defaults:
  run:
    working-directory: research/R40_KZ
jobs:
  hyp3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-earthdata.txt
      - name: Run
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          R40_OUT: output_hyp3
          MODE: ${{ inputs.mode }}
          YEARS: ${{ inputs.years }}
          TRACKS: ${{ inputs.tracks }}
          MPT: ${{ inputs.max_per_track }}
          MJ: ${{ inputs.max_jobs }}
          BUDGET: ${{ inputs.budget }}
        run: python -m src.hyp3_s1 --mode "$MODE" --years "$YEARS" --tracks "$TRACKS" --max-per-track "$MPT" --max-jobs "$MJ" --budget "$BUDGET" 2>&1 | tee hyp3_console.log
      - name: Guard - token must not appear in outputs
        if: always()
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          mkdir -p output_hyp3; cp hyp3_console.log output_hyp3/ 2>/dev/null || true
          if [ -n "$EARTHDATA_TOKEN" ] && grep -rF -- "$EARTHDATA_TOKEN" output_hyp3; then echo "TOKEN LEAK"; rm -rf output_hyp3; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R40-HyP3-${{ inputs.mode }}
          path: research/R40_KZ/output_hyp3/
          retention-days: 90
      - name: Publish small JSON results to branch r40-hyp3
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/res && mkdir /tmp/res && cd output_hyp3 && find . -maxdepth 1 -type f \( -name '*.json' -o -name '*.log' -o -name '*.csv' \) -exec cp {} /tmp/res/ \;
          cd /tmp/res && git init -q -b r40-hyp3
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "R40 HyP3 ${{ inputs.mode }}: run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "HEAD:refs/heads/r40-hyp3-${{ inputs.mode }}"
