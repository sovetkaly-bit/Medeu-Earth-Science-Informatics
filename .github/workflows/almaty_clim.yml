name: almaty-clim
on:
  workflow_dispatch:
  push:
    branches: [almaty-clim]
jobs:
  slip:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pandas numpy
      - shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/res && cd research/ALMATY_CLIM && python clim.py /tmp/res 2>&1 | tee /tmp/res/log_slip.txt
          cd /tmp/res && git init -q && git checkout -q -b almaty-clim-results
          git config user.email a@b.c && git config user.name bot
          git add -A && git commit -qm results
          git remote add o "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f o almaty-clim-results
