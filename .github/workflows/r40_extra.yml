name: R40 extra checks (paired bootstrap, leave-one-country-out, calibration, feature range)
on:
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    working-directory: research/R40_KZ
jobs:
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Run
        env:
          R40_OUT: output_extra
        run: python -m src.extra_checks 2>&1 | tee extra_console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R40-extra
          path: research/R40_KZ/output_extra/tables/
          retention-days: 90
      - name: Publish tables to branch r40-extra
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/res && mkdir -p /tmp/res/tables && cp output_extra/tables/*.csv /tmp/res/tables/ 2>/dev/null || true
          cp output_extra/*.json output_extra/*.csv extra_console.log /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q -b r40-extra
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "R40 extra checks: run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "HEAD:refs/heads/r40-extra"
